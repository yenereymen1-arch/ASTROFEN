<!-- JavaScript Oyun ve Etkileşim Kodları -->
    <script>
        function konulariGoster() {
            var liste = document.getElementById("konuListesi");
            liste.classList.toggle("acik");
        }

        function oyunuAc(uniteNo) {
            var oyunAlani = document.getElementById("oyunAlani");
            oyunAlani.style.display = "block";
            document.getElementById("oyunBaslik").innerText = "🎮 " + uniteNo + ". Ünite - 20 Soruluk Fen Bilimleri Oyunu";
            
            // Her soruya özel video çözüm butonlu 20 soruluk yapı
            document.getElementById("soruKutusu").innerHTML = `
                <div style="max-height: 400px; overflow-y: auto; padding-right: 10px;">
                    <p><strong>1. Güneş'in katmanları içinde en sıcak katman hangisidir?</strong></p>
                    <label><input type="radio" name="s1" value="A"> A) Işık küre</label><br>
                    <label><input type="radio" name="s1" value="B"> B) Çekirdek</label><br>
                    <label><input type="radio" name="s1" value="C"> C) Renk küre</label><br>
                    <label><input type="radio" name="s1" value="D"> D) Taç küre</label><br>
                    <a href="http://www.youtube.com/watch?v=mGBJOFvH8aw" target="_blank" class="video-buton">🎥 1. Sorunun Video Çözümünü İzle</a><br><hr>

                    <p><strong>2. Ay'ın ana evrelerinden biri hangisidir?</strong></p>
                    <label><input type="radio" name="s2" value="A"> A) Hilal</label><br>
                    <label><input type="radio" name="s2" value="B"> B) Dolunay</label><br>
                    <label><input type="radio" name="s2" value="C"> C) Şişkin ay</label><br>
                    <label><input type="radio" name="s2" value="D"> D) Son hilal</label><br>
                    <a href="http://www.youtube.com/watch?v=1c3-XkWcbQA" target="_blank" class="video-buton">🎥 2. Sorunun Video Çözümünü İzle</a><br><hr>

                    <p><strong>3. Aşağıdakilerden hangisi Güneş'in özelliklerinden biridir?</strong></p>
                    <label><input type="radio" name="s3" value="A"> A) Isı ve ışık yayar</label><br>
                    <label><input type="radio" name="s3" value="B"> B) Dünyanın uydusudur</label><br>
                    <label><input type="radio" name="s3" value="C"> C) Atmosferi çok kalındır</label><br>
                    <label><input type="radio" name="s3" value="D"> D) Üzerinde su bulunur</label><br>
                    <a href="http://www.youtube.com/watch?v=nWDJKkxhIro" target="_blank" class="video-buton">🎥 3. Sorunun Video Çözümünü İzle</a><br><hr>

                    <p><em>(Diğer sorular için aynı video buton yapısını 20'ye kadar çoğaltabilirsin!)</em></p>
                </div>
            `;
            oyunAlani.scrollIntoView({ behavior: 'smooth' });
        }

        function cevabiKontrolEt() {
            let dogruCevaplar = { s1: "B", s2: "B", s3: "A" };
            let dogruSayisi = 0;

            for (let i = 1; i <= 3; i++) {
                let secilen = document.querySelector('input[name="s' + i + '"]:checked');
                if (secilen && secilen.value === dogruCevaplar['s' + i]) {
                    dogruSayisi++;
                }
            }

            document.getElementById("skorYazisi").innerText = "🎉 Test Bitti! Doğru Sayısı: " + dogruSayisi;
            document.getElementById("skorYazisi").style.color = "#16a34a";
        }

        function oyunuKapat() {
            document.getElementById("oyunAlani").style.display = "none";
        }
    </script>
