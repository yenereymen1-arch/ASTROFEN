<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTROFEN - 5. Sınıf Uzay ve Fen Macerası</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0b0d17, #1a1c2e, #2d1b4e);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: #ffffff;
        }
        .kart {
            background: rgba(22, 27, 46, 0.85);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 240, 255, 0.2);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 240, 255, 0.3);
            text-align: center;
            max-width: 800px;
            width: 100%;
        }
        h1 {
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            font-size: 32px;
            margin-bottom: 10px;
        }
        p { color: #c3c7db; }
        .buton {
            background: linear-gradient(90deg, #7928ca, #ff0080);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .buton:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 0, 128, 0.4);
        }
        .buton-quiz {
            background: linear-gradient(90deg, #00f0ff, #7928ca);
        }
        .buton-unite {
            background: linear-gradient(90deg, #11998e, #38ef7d);
        }
        .secenek-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(0, 240, 255, 0.4);
            color: white;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            text-align: left;
            transition: all 0.2s;
            width: 100%;
            margin-bottom: 8px;
        }
        .secenek-btn:hover {
            background: rgba(0, 240, 255, 0.25);
        }
        .kart-grid-30 {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            margin-top: 20px;
        }
        .oyun-karti {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 8px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            user-select: none;
        }
        .unite-liste {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        .unite-sec-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(56, 239, 125, 0.4);
            color: #fff;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            font-weight: bold;
        }
        .unite-sec-btn:hover {
            background: rgba(56, 239, 125, 0.2);
        }
        @media (max-width: 600px) {
            .kart-grid-30 {
                grid-template-columns: repeat(5, 1fr);
            }
        }
    </style>
</head>
<body>

    <!-- 1. ANA MENÜ KARTI -->
    <div class="kart" id="anaKart">
        <h1>ASTROFEN 🚀</h1>
        <p>5. Sınıf Uzay ve Fen Bilimleri Portalı</p>

        <button class="buton" onclick="kartOyununuAc()">🃏 30 Kartlı Uzay Çevirmece Oyunu</button>
        <button class="buton buton-quiz" onclick="quiziBaslat()">🧠 Genel Uzay Bilgi Yarışması (Quiz)</button>
        <button class="buton buton-unite" onclick="uniteleriAc()">📚 5. Sınıf Ünite Testleri (20'şer Soru)</button>
    </div>

    <!-- 2. 30 KARTLI ÇEVİRMECE OYUNU -->
    <div class="kart" id="kartOyunKart" style="display: none;">
        <h2 style="color: #00f0ff;">🃏 30 Kartlı Uzay Eşleştirme</h2>
        <p>30 kart (15 çift) içinden aynı uzay simgelerini bulup eşleştir!</p>
        <div class="kart-grid-30" id="kartAlani"></div>
        <button onclick="anaMenuyeDon()" class="buton" style="background: #6c757d; margin-top: 20px;">⬅️ Ana Menüye Dön</button>
    </div>

    <!-- 3. GENEL QUIZ EKRANI -->
    <div class="kart" id="quizKart" style="display: none; text-align: left;">
        <h2 style="color: #00f0ff; text-align: center;">🚀 Uzay Bilgi Yarışması</h2>
        <div style="display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 15px; color: #ff0080;">
            <span id="puanYazisi">Puan: 0</span>
            <span id="unvanYazisi">Unvan: Çaylak Astronot 👨‍🚀</span>
        </div>
        
        <p id="soruMetni" style="font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #ffffff;"></p>
        <div id="seceneklerAlani" style="display: flex; flex-direction: column;"></div>
        
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button onclick="jokerKullan()" id="jokerBtn" class="buton" style="background: #e6a23c; margin: 0;">💡 İpucu Jokeri (1)</button>
            <button onclick="anaMenuyeDon()" class="buton" style="background: #6c757d; margin: 0;">⬅️ Ana Menüye Dön</button>
        </div>
    </div>

    <!-- 4. ÜNİTE SEÇİM EKRANI -->
    <div class="kart" id="uniteSecimKart" style="display: none; text-align: left;">
        <h2 style="color: #38ef7d; text-align: center;">📚 Test Çözmek İstediğin Üniteyi Seç</h2>
        <p style="text-align: center; color: #c3c7db;">Her ünitede 20 soru bulunmaktadır.</p>
        <div class="unite-liste">
            <button class="unite-sec-btn" onclick="uniteTestiBaslat(1)">☀️ 1. Ünite: Güneş, Dünya ve Ay (20 Soru)</button>
            <button class="unite-sec-btn" onclick="uniteTestiBaslat(2)">🐸 2. Ünite: Canlılar Dünyası (20 Soru)</button>
            <button class="unite-sec-btn" onclick="uniteTestiBaslat(3)">🏃 3. Ünite: Kuvvetin Ölçülmesi ve Sürtünme (20 Soru)</button>
            <button class="unite-sec-btn" onclick="uniteTestiBaslat(4)">🧊 4. Ünite: Maddenin Değişimi (20 Soru)</button>
            <button class="unite-sec-btn" onclick="uniteTestiBaslat(5)">💡 5. Ünite: Işığın Yayılması (20 Soru)</button>
            <button class="unite-sec-btn" onclick="uniteTestiBaslat(6)">⚡ 6. Ünite: Elektrik Devre Elemanları (20 Soru)</button>
            <button class="unite-sec-btn" onclick="uniteTestiBaslat(7)">🌱 7. Ünite: İnsan ve Çevre (20 Soru)</button>
        </div>
        <button onclick="anaMenuyeDon()" class="buton" style="background: #6c757d; margin-top: 20px;">⬅️ Ana Menüye Dön</button>
    </div>

    <!-- 5. ÜNİTE TEST EKRANI -->
    <div class="kart" id="uniteTestKart" style="display: none; text-align: left;">
        <h3 id="uniteBaslik" style="color: #38ef7d; text-align: center;"></h3>
        <div style="display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 15px; color: #00f0ff;">
            <span id="uniteSoruNo">Soru: 1/20</span>
            <span id="unitePuanYazisi">Puan: 0</span>
        </div>
        
        <p id="uniteSoruMetni" style="font-size: 17px; font-weight: bold; margin-bottom: 15px; color: #ffffff;"></p>
        <div id="uniteSeceneklerAlani" style="display: flex; flex-direction: column;"></div>
        
        <button onclick="uniteleriAc()" class="buton" style="background: #6c757d; margin-top: 15px;">⬅️ Ünite Seçimine Dön</button>
    </div>

    <script>
        // --- MENÜ GEÇİŞLERİ ---
        function tumKartlariGizle() {
            document.getElementById('anaKart').style.display = 'none';
            document.getElementById('kartOyunKart').style.display = 'none';
            document.getElementById('quizKart').style.display = 'none';
            document.getElementById('uniteSecimKart').style.display = 'none';
            document.getElementById('uniteTestKart').style.display = 'none';
        }

        function anaMenuyeDon() {
            tumKartlariGizle();
            document.getElementById('anaKart').style.display = 'block';
        }

        function uniteleriAc() {
            tumKartlariGizle();
            document.getElementById('uniteSecimKart').style.display = 'block';
        }

        // --- 30 KARTLI EŞLEŞTİRME OYUNU (15 ÇİFT) ---
        const semboller30 = ['🚀', '🪐', '🌙', '☀️', '⭐', '👨‍🚀', '☄️', '🛸', '🛰️', '🌌', '👽', '🔭', '🌍', '🌠', '⚡'];
        let acikKartlar = [];
        
        function kartOyununuAc() {
            tumKartlariGizle();
            document.getElementById('kartOyunKart').style.display = 'block';
            let kartlar = [...semboller30, ...semboller30].sort(() => Math.random() - 0.5);
            let alan = document.getElementById('kartAlani');
            alan.innerHTML = '';
            acikKartlar = [];

            kartlar.forEach((sembol) => {
                let div = document.createElement('div');
                div.className = 'oyun-karti';
                div.innerText = '❓';
                div.onclick = () => {
                    if (div.innerText !== '❓' || acikKartlar.length >= 2) return;
                    div.innerText = sembol;
                    acikKartlar.push(div);

                    if (acikKartlar.length === 2) {
                        if (acikKartlar[0].innerText === acikKartlar[1].innerText) {
                            acikKartlar = [];
                        } else {
                            setTimeout(() => {
                                acikKartlar[0].innerText = '❓';
                                acikKartlar[1].innerText = '❓';
                                acikKartlar = [];
                            }, 800);
                        }
                    }
                };
                alan.appendChild(div);
            });
        }

        // --- GENEL QUIZ MANTIĞI ---
        const sorular = [
            { soru: "Güneş Sistemindeki Güneş'e en yakın gezegen hangisidir?", secenekler: ["Venüs", "Merkür", "Mars", "Dünya"], dogru: 1, ipucu: "En küçük gezegendir." },
            { soru: "Ay'ın ana evrelerinden biri olmayan hangisidir?", secenekler: ["Yeni Ay", "Mavi Ay", "İlk Dördün", "Dolunay"], dogru: 1, ipucu: "Gökyüzünde renk isimleriyle bilinen evre ana evre değildir." },
            { soru: "Dünya'mızın tek doğal uydusu aşağıdakilerden hangisidir?", secenekler: ["Güneş", "Ay", "Mars", "Jüpiter"], dogru: 1, ipucu: "Geceleri gökyüzünü aydınlatan komşumuz." },
            { soru: "Güneş Sisteminin en büyük gezegeni hangisidir?", secenekler: ["Satürn", "Jüpiter", "Neptün", "Uranüs"], dogru: 1, ipucu: "Dev gaz gezegenidir." },
            { soru: "Sürtünme kuvveti hareketi nasıl etkiler?", secenekler: ["Hızlandırır", "Yavaşlatır/Durdurur", "Etkilemez", "Yönünü değiştirmez"], dogru: 1, ipucu: "Hareketin tersi yönünde etki eder." }
        ];

        let aktifSoru = 0;
        let puan = 0;
        let jokerHakki = 1;

        function quiziBaslat() {
            tumKartlariGizle();
            document.getElementById('quizKart').style.display = 'block';
            aktifSoru = 0;
            puan = 0;
            jokerHakki = 1;
            document.getElementById('jokerBtn').disabled = false;
            document.getElementById('jokerBtn').innerText = "💡 İpucu Jokeri (1)";
            soruyuGoster();
        }

        function unvanGuncelle() {
            let unvan = "Çaylak Astronot 👨‍🚀";
            if(puan >= 20) unvan = "Uzay Kaşifi 🛰️";
            if(puan >= 40) unvan = "Galaksi Kaptanı 🚀";
            if(puan >= 50) unvan = "Evrenin Profesörü 🌟";
            document.getElementById('unvanYazisi').innerText = "Unvan: " + unvan;
        }

        function soruyuGoster() {
            if (aktifSoru < sorular.length) {
                let q = sorular[aktifSoru];
                document.getElementById('soruMetni').innerText = (aktifSoru + 1) + ". " + q.soru;
                let alan = document.getElementById('seceneklerAlani');
                alan.innerHTML = "";
                
                q.secenekler.forEach((secenek, index) => {
                    let btn = document.createElement('button');
                    btn.innerText = secenek;
                    btn.className = 'secenek-btn';
                    btn.onclick = () => cevapVer(index);
                    alan.appendChild(btn);
                });
                document.getElementById('puanYazisi').innerText = "Puan: " + puan;
                unvanGuncelle();
            } else {
                document.getElementById('quizKart').innerHTML = `
                    <h2 style="color: #00f0ff; text-align: center;">🎉 Tebrikler! Yarışmayı Bitirdin!</h2>
                    <p style="text-align: center; font-size: 20px; color: #fff;">Toplam Puanın: <strong>${puan}</strong></p>
                    <p style="text-align: center; font-size: 18px; color: #00f0ff;">Son Unvanın: ${document.getElementById('unvanYazisi').innerText.replace('Unvan: ', '')}</p>
                    <button onclick="anaMenuyeDon()" class="buton">🔄 Ana Menüye Dön</button>
                `;
            }
        }

        function cevapVer(secim) {
            if (secim === sorular[aktifSoru].dogru) {
                puan += 10;
                alert("Harika! Doğru cevap! 🚀 (+10 Puan)");
            } else {
                alert("Yanlış cevap! Olsun, öğrenmiş olduk 😊");
            }
            aktifSoru++;
            soruyuGoster();
        }

        function jokerKullan() {
            if(jokerHakki > 0) {
                alert("💡 İpucu: " + sorular[aktifSoru].ipucu);
                jokerHakki--;
                document.getElementById('jokerBtn').disabled = true;
                document.getElementById('jokerBtn').innerText = "💡 İpucu Jokeri Kullanıldı";
            }
        }

        // --- ÜNİTE TESTLERİ (20'ŞER SORU) ---
        let secilenUniteSoruListesi = [];
        let uSoruIdx = 0;
        let uPuan = 0;
        let uDogru = 0;
        let uYanlis = 0;

        function soruUret(uniteNo) {
            let liste = [];
            for(let i=1; i<=20; i++) {
                liste.push({
                    soru: `[Ünite ${uniteNo} - Soru ${i}] 5. Sınıf ${uniteNo}. Ünite ile ilgili ${i}. pekiştirme sorusunun doğru şıkkı nedir?`,
                    secenekler: ["A) Doğru Seçenek 1", "B) Doğru Seçenek 2", "C) Doğru Seçenek 3", "D) Doğru Seçenek 4"],
                    dogru: (i % 4) // Şıklar arasında dağılım yapması için
                });
            }
            return liste;
        }

        function uniteTestiBaslat(uniteNo) {
            tumKartlariGizle();
            document.getElementById('uniteTestKart').style.display = 'block';
            document.getElementById('uniteBaslik').innerText = `${uniteNo}. Ünite Testi`;
            
            secilenUniteSoruListesi = soruUret(uniteNo);
            uSoruIdx = 0;
            uPuan = 0;
            uDogru = 0;
            uYanlis = 0;
            
            uniteSorusuGoster();
        }

        function uniteSorusuGoster() {
            if (uSoruIdx < 20) {
                let q = secilenUniteSoruListesi[uSoruIdx];
                document.getElementById('uniteSoruNo').innerText = `Soru: ${uSoruIdx + 1} / 20`;
                document.getElementById('unitePuanYazisi').innerText = `Puan: ${uPuan}`;
                document.getElementById('uniteSoruMetni').innerText = q.soru;
                
                let alan = document.getElementById('uniteSeceneklerAlani');
                alan.innerHTML = "";
                
                q.secenekler.forEach((secenek, index) => {
                    let btn = document.createElement('button');
                    btn.innerText = secenek;
                    btn.className = 'secenek-btn';
                    btn.onclick = () => uniteCevapVer(index);
                    alan.appendChild(btn);
                });
            } else {
                // TEST BİTTİĞİNDE PUANI VE SONUCU SÖYLE
                let basari = "Geliştirilebilir 🎯";
                if(uPuan >= 50) basari = "İyi 👍";
                if(uPuan >= 80) basari = "Harika! 🌟";
                if(uPuan === 100) basari = "Mükemmel! Tam Puan! 🏆";

                document.getElementById('uniteTestKart').innerHTML = `
                    <h2 style="color: #38ef7d; text-align: center;">🎉 Test Tamamlandı!</h2>
                    <div style="background: rgba(0,0,0,0.3); padding: 20px; border-radius: 12px; font-size: 18px; margin: 15px 0;">
                        <p style="color: #00f0ff;"><strong>Toplam Puanın:</strong> ${uPuan} / 100</p>
                        <p style="color: #38ef7d;"><strong>Doğru Sayısı:</strong> ${uDogru}</p>
                        <p style="color: #ff0080;"><strong>Yanlış Sayısı:</strong> ${uYanlis}</p>
                        <p style="color: #e6a23c;"><strong>Derecen:</strong> ${basari}</p>
                    </div>
                    <button onclick="uniteleriAc()" class="buton" style="background: #38ef7d;">📚 Başka Ünite Seç</button>
                    <button onclick="anaMenuyeDon()" class="buton" style="background: #6c757d; margin-top: 10px;">⬅️ Ana Menüye Dön</button>
                `;
            }
        }

        function uniteCevapVer(secim) {
            if (secim === secilenUniteSoruListesi[uSoruIdx].dogru) {
                uPuan += 5; // 20 soru x 5 puan = 100 Puan
                uDogru++;
                alert("Doğru Cevap! (+5 Puan) 👏");
            } else {
                uYanlis++;
                alert("Yanlış Cevap! Olsun, diğer soruya geçelim 😊");
            }
            uSoruIdx++;
            uniteSorusuGoster();
        }
    </script>
</body>
</html>
